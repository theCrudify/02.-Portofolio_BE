name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"


[triggers]
crons = ["10 0 * * *"]

# Per-visitor limit for /v1/* (Workers Rate Limiting, free plan). namespace_id is any
# account-unique integer string.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
